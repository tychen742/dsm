name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production_dsm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "sphinx<7.2" "sphinx-new-tab-link<0.5" "docutils<0.21" "sphinx-external-toc~=1.0.1" jupyter-book==1.0.4.post1 sphinx==7.1.2 sphinx-new-tab-link==0.4.0 docutils==0.20.1 sphinx-external-toc==1.0.1
          pip install sphinxcontrib.mermaid

      - name: Cache Jupyter execution outputs
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('**/*.ipynb') }}
          restore-keys: |
            jupyter-cache-

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Add chapter slide decks
        run: |
          cp -R _html_extra/chapters/. _build/html/chapters/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          rsync -avz --no-perms --no-owner --no-group --omit-dir-times --exclude "reports/" \
            _build/html/ ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:/var/www/dsm/
          rsync -avz --no-perms --no-owner --no-group --omit-dir-times \
            _html_extra/api/ ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:/var/www/dsm/api/
