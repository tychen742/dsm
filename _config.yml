# Book settings
title: Think Data Science
author: "Tsangyao Chen"
copyright: "2026"
logo: ./_static/logo.png
language: en
only_build_toc_files: true

# Execution settings
# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: cache ### was auto but crashing over 0401
  kernel_name: python3
  exclude_tags: [skip-execution]
  timeout: 300
  allow_errors: false
  stderr_output: show
  output_cache: true

# Sphinx settings
sphinx:
  extra_extensions:
    - sphinx_new_tab_link
    - sphinx.ext.autodoc
    - sphinx_thebe
    - sphinxcontrib.mermaid
    - sphinxcontrib.bibtex
  local_extensions:
    appendix_numbering: _ext
  config:
    bibtex_bibfiles:
      - references.bib
    bibtex_reference_style: author_year
    bibtex_default_style: unsrt ### Keep bibliography numeric/ordered
    html_static_path: ["_static"]
    html_css_files:
      - shared.css
      - custom.css
    html_js_files:
      - custom.js
    new_tab_link_show_external_link_icon: true
    new_tab_link_enable_referrer: false
    html_use_index: true
    html_domain_indices: true
    thebe_config:
      repository_url: https://github.com/tychen742/dsm
      repository_branch: binder
      kernel_name: python3
      # THEBE SETUP (Feb 10, 2026):
      # - Keep Thebe off hidden solution cells so Jupyter Book's
      #   "Show code cell source" answer toggles remain intact.
      # - Exercise cells are visually distinguished, visible cells are interactive,
      #   and hidden setup cells can opt in with runnable.
      # selector: "div.tag_thebe-interactive"  # Old: only exercise cells were interactive
      selector: "div.cell:not(.tag_hide-input), div.cell.tag_runnable"
      selector_input: "div.cell_input"
      selector_output: "div.cell_output"
      bootstrap: false # Don't auto-start kernel on page load
      requestKernel: true # Request kernel when Thebe is activated
      predefinedOutput: false # Hide static output when Thebe is active (shows fresh execution results)
    html_theme_options:
      repository_url: https://github.com/tychen742/dsm
      repository_branch: main
      use_issues_button: true
      use_repository_button: true
      use_edit_page_button: true
      show_prev_next: true
      navigation_with_keys: true
      launch_buttons:
        thebe: true
        # binderhub_url: "https://mybinder.org"

# citeproc:
#     style: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl

repository:
  url: https://github.com/tychen742/dsm
  branch: main

# HTML/theme settings
html:
  use_numbered_headings: true
  number_toc_depth: 4
  favicon: ./_static/favicon-io_gg/favicon.ico

# MyST parsing
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - html_admonition
    - html_image
    # - citations            # REMOVE: not supported in myst-parser 3.0

exclude_patterns:
  - .venv
  - assignments
  - assignments/**
  - materials
  - materials/**
  - _build
  - _build_*
  - _build_local
  - _build_test
  - otter_files
  - temps
  - tests
  - .ipynb_checkpoints
  - _static/.ipynb_checkpoints
  - .DS_Store
  - README.md
  - test3.ipynb
  - chapters/appendices/x_chap01-on-programming.ipynb
  - chapters/09-pandas/project-ecommerce-purchases-questions.ipynb
  - figures/**/*.ipynb
  - "**/*~" # Backup files
  - "**/.DS_Store" # Mac files anywhere
